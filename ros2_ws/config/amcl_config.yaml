amcl:
  ros__parameters:
    # ============================
    # Time & Simulation Settings
    # ============================
    use_sim_time: False        # 🔧 Set False for real robot, True only if using Gazebo
    tf_broadcast: true         # Allow AMCL to publish map<->odom transform
    tf_broadcast_inverted: true # 🔥 Ensure correct direction: map → odom
    transform_tolerance: 0.3   # Time window to accept delayed transforms
    save_pose_rate: 0.5        # Save current pose every 2 seconds

    # ============================
    # Frame Configuration
    # ============================
    base_frame_id: "base_link"  # ✅ Match your odometry child frame
    global_frame_id: "map"
    odom_frame_id: "odom"

    # ============================
    # Motion Model Parameters
    # ============================
    # For differential drive robots
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2   # Rotation noise due to rotation
    alpha2: 0.2   # Rotation noise due to translation
    alpha3: 0.2   # Translation noise due to translation
    alpha4: 0.2   # Translation noise due to rotation
    alpha5: 0.2   # Strafe translation noise (unused for diff drive)

    # ============================
    # Laser Scan Model (RPLidar A1M8)
    # ============================
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: 0.15
    laser_likelihood_max_dist: 2.0
    max_beams: 180  # A1M8 has 360 points; 180 is efficient and accurate

    # ============================
    # Beam Skipping (for mirrors & glass)
    # ============================
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # ============================
    # Particle Filter Parameters
    # ============================
    min_particles: 500
    max_particles: 5000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1

    # ============================
    # Update Thresholds
    # ============================
    update_min_d: 0.15  # meters moved before updating filter
    update_min_a: 0.15  # radians rotated before updating

    # ============================
    # Recovery (adaptive resampling)
    # ============================
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

    # ============================
    # Laser Likelihood Field Model Weights
    # ============================
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    lambda_short: 0.1

    # ============================
    # Initial Pose
    # ============================
    set_initial_pose: false  # You’ll set it manually via RViz 2D Pose Estimate
    # initial_pose:
    #   x: 0.0
    #   y: 0.0
    #   z: 0.0
    #   yaw: 0.0
