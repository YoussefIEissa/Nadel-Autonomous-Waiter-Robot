bt_navigator:
  ros__parameters:
    use_sim_time: False  # Change to False for real robot
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom  # Changed to match your controller's odom topic
    bt_loop_duration: 10
    default_server_timeout: 20
    
    # Groot monitoring for behavior tree visualization (optional but helpful)
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    
    # Path to your behavior tree XML file
    default_nav_to_pose_bt_xml: "/home/nadel/Autn_Waiter_ws/src/navigation/config/behavior.xml"  # Update this path!
    default_nav_through_poses_bt_xml: ""
    
    # Behavior Tree node plugins (Humble syntax)
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_rate_controller_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_spin_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_wait_action_bt_node


    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
