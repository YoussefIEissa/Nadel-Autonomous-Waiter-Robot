controller_server:
  ros__parameters:
    use_sim_time: false  # Change to False for real robot
    controller_frequency: 20.0  # Increased from 10.0 for smoother control
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1  # Tightened from 0.25 for precise delivery
      yaw_goal_tolerance: 0.15  # Tightened from 0.25
    
    # DWB Local Planner parameters (optimized for waiter robot)
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 1.0
      min_vel_y: 1.0
      max_vel_x: 2.0  # Increased from 0.3 for faster delivery
      max_vel_y: 2.0
      max_vel_theta: 1.5  # Increased from 1.0 for quicker turns
      min_speed_x: 1.0
      max_speed_xy: 2.0  # Increased from 0.3
      min_speed_theta: 1.0
      
      # Acceleration limits (match your diff_drive_controller.yaml)
      acc_lim_x: 1.0  # Reduced from 2.5 for smooth acceleration (no spilling!)
      acc_lim_y: 0.0
      acc_lim_theta: 1.5  # Reduced from 3.2 for smooth turns
      decel_lim_x: -1.5  # Gentler deceleration
      decel_lim_y: 0.0
      decel_lim_theta: -2.0  # Gentler rotation deceleration
      
      # Trajectory sampling
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 2.0  # Increased from 1.7 for better lookahead
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      
      # Goal tolerance
      xy_goal_tolerance: 0.1  # Match goal_checker
      trans_stopped_velocity: 0.1  # Reduced from 0.25 for more precise stopping
      short_circuit_trajectory_evaluation: True
      stateful: True
      
      # Critics (trajectory scoring)
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.05  # Increased from 0.02 for better obstacle avoidance
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

## Local costmap configuration
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False  # Change to False for real robot
      rolling_window: true
      width: 3  # Increased from 1 to 3 meters
      height: 3  # Increased from 1 to 3 meters
      resolution: 0.05  # 5cm resolution (good for indoor)
      robot_radius: 0.12  # Increased from 0.1 (your robot is ~18cm wide, add safety margin)
      plugins: ["voxel_layer", "inflation_layer"]
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.3  # Increased from 0.1 for safety buffer around obstacles
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0  # Increased from 3.0 to use full A1M8 range
          raytrace_min_range: 0.15  # A1M8 minimum range
          obstacle_max_range: 8.0  # Increased from 2.5
          obstacle_min_range: 0.15  # A1M8 minimum range
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      always_send_full_costmap: True
